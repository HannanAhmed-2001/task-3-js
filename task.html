<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>User Manager | Firebase CRUD</title>
    <style>
        :root {
            --p: #6d5dfc;
            --pd: #5144d9;
            --ink: #1f2937;
            --muted: #667085;
            --line: #e7eaf2;
            --danger: #d92d20
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: Inter, system-ui, sans-serif;
            background: linear-gradient(135deg, #f5f3ff, #eef7ff 52%, #f8fafc)
        }

        .shell {
            width: min(1120px, calc(100% - 32px));
            margin: auto;
            padding: 48px 0
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 24px;
            margin-bottom: 26px
        }

        .eyebrow {
            color: var(--p);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .14em;
            text-transform: uppercase
        }

        h1 {
            margin: 8px 0;
            font-size: clamp(30px, 4vw, 44px);
            letter-spacing: -.04em
        }

        .subtitle {
            margin: 0;
            color: var(--muted)
        }

        .badge {
            padding: 10px 14px;
            border: 1px solid #dcd8ff;
            border-radius: 999px;
            color: var(--pd);
            background: #f7f6ff;
            font-size: 13px;
            font-weight: 700
        }

        .card {
            border: 1px solid #fff;
            border-radius: 22px;
            background: rgba(255, 255, 255, .94);
            box-shadow: 0 18px 50px #1f293717;
            overflow: hidden
        }

        .form-card {
            padding: 24px;
            margin-bottom: 22px
        }

        .section-title {
            margin: 0 0 18px;
            font-size: 18px
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr auto;
            gap: 14px;
            align-items: end
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #475467;
            font-size: 13px;
            font-weight: 700
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d9deea;
            border-radius: 11px;
            font: inherit;
            outline: 0
        }

        input:focus {
            border-color: var(--p);
            box-shadow: 0 0 0 4px #6d5dfc1f
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 17px;
            color: #fff;
            background: var(--p);
            font: inherit;
            font-weight: 750;
            cursor: pointer
        }

        button:hover {
            background: var(--pd)
        }

        button:disabled {
            opacity: .6;
            cursor: wait
        }

        .cancel-btn {
            display: none;
            margin-left: 8px;
            color: #475467;
            background: #eef0f5
        }

        .table-head {
            display: flex;
            justify-content: space-between;
            padding: 22px 24px;
            border-bottom: 1px solid var(--line)
        }

        .table-head h2 {
            margin: 0;
            font-size: 18px
        }

        #userCount {
            color: var(--muted);
            font-size: 13px
        }

        .table-wrap {
            overflow-x: auto
        }

        table {
            width: 100%;
            min-width: 720px;
            border-collapse: collapse
        }

        th,
        td {
            padding: 17px 24px;
            border-bottom: 1px solid var(--line);
            text-align: left
        }

        th {
            color: #667085;
            background: #fbfcfe;
            font-size: 12px;
            text-transform: uppercase
        }

        td {
            font-size: 14px
        }

        .user-name {
            font-weight: 750
        }

        .password-cell {
            color: #667085;
            letter-spacing: 3px
        }

        .actions {
            display: flex;
            gap: 8px
        }

        .small-btn {
            padding: 8px 12px;
            font-size: 12px
        }

        .edit-btn {
            color: #493cc7;
            background: #eeecff
        }

        .delete-btn {
            color: var(--danger);
            background: #fff0ef
        }

        .empty,
        .loading {
            padding: 42px 24px;
            color: var(--muted);
            text-align: center
        }

        #status {
            min-height: 21px;
            margin-top: 12px;
            color: var(--muted);
            font-size: 13px
        }

        #status.success {
            color: #087443
        }

        #status.error {
            color: var(--danger)
        }

        @media(max-width:800px) {
            .hero {
                align-items: start;
                flex-direction: column
            }

            .form-grid {
                grid-template-columns: 1fr 1fr
            }

            .form-actions {
                grid-column: 1/-1
            }
        }

        @media(max-width:500px) {
            .shell {
                width: calc(100% - 20px);
                padding: 28px 0
            }

            .form-grid {
                grid-template-columns: 1fr
            }

            .form-actions {
                grid-column: auto
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <header class="hero">
            <div>
                <div class="eyebrow">Firebase CRUD dashboard</div>
                <h1>User manager</h1>
                <p class="subtitle">Username, email aur password ko yahin se add, edit aur delete karein.</p>
            </div>
            <div class="badge">● Realtime Database</div>
        </header>
        <section class="card form-card">
            <h2 class="section-title" id="formTitle">Add new user</h2>
            <form id="userForm">
                <div class="form-grid">
                    <div><label for="username">Username</label><input id="username" type="text"
                            placeholder="e.g. Ali Khan" required></div>
                    <div><label for="email">Email address</label><input id="email" type="email"
                            placeholder="ali@example.com" required></div>
                    <div><label for="password">Password</label><input id="password" type="password" minlength="6"
                            placeholder="Minimum 6 characters" required></div>
                    <div class="form-actions"><button id="submitBtn">Add user</button><button class="cancel-btn"
                            id="cancelBtn" type="button">Cancel</button></div>
                </div>
            </form>
            <div id="status" aria-live="polite"></div>
        </section>
        <section class="card">
            <div class="table-head">
                <h2>Saved users</h2><span id="userCount">0 users</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Password</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userList">
                        <tr>
                            <td class="loading" colspan="4">Loading users...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>

</body>

</html>
